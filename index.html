
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081321">
  <title>ARTHER AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">A</div>
      <div>
        <b>ARTHER</b>
        <small>PERSONAL AI ASSISTANT</small>
      </div>
      <span id="connection" class="pill">يفحص الاتصال...</span>
    </header>

    <section class="intro">
      <div class="orb">A</div>
      <p class="kicker">PERSONAL AI · VOICE CONTROL</p>
      <h1>أنا هنا، تفضل.</h1>
      <p>قل «آرثر» ثم أعطني أمرك بصوتك</p>
    </section>

    <section id="report" class="report hidden"></section>

    <section class="workspace">
      <label for="question">الأوامر الصوتية</label>
      <textarea id="question" rows="4"
        placeholder="اكتب أمرك أو اضغط على الميكروفون..."></textarea>

      <div class="actions">
        <button id="listen" class="mic">🎙️ استمع إليّ</button>
        <button id="run" class="primary">تنفيذ الأمر</button>
        <button id="stopVoice" class="secondary">إيقاف الصوت</button>
      </div>

      <div class="actions">
        <button id="home" class="secondary">الشاشة الرئيسية</button>
        <button id="back" class="secondary">رجوع</button>
        <button id="scrollDown" class="secondary">تمرير للأسفل</button>
      </div>

      <div class="actions">
        <button id="shizuku" class="secondary">ربط Shizuku</button>
      </div>
      <p id="voiceStatus" class="status">الصوت جاهز</p>
    </section>

    <footer>ARTHER · ALWAYS READY WHEN THE APP IS OPEN</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
