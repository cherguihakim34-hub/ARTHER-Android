name: Validate ARTHER source

on:
  push:
    branches:
      - arther-dev
  pull_request:
    branches:
      - main
      - arther-chatgpt-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Compile Python sources
        run: python -m py_compile main.py agent_core.py memory_store.py planner.py

      - name: Run deterministic simulation smoke test
        run: python test_simulation.py

      - name: Validate Android XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          paths = [
              Path("android-native/app/src/main/AndroidManifest.xml"),
              Path("android-native/app/src/main/res/xml/arther_accessibility.xml"),
              Path("android-native/app/src/main/res/values/arther_strings.xml"),
          ]
          for path in paths:
              ET.parse(path)
              print("XML OK:", path)
          PY

      - name: Check required native source files
        run: |
          test -s android-native/app/src/main/java/com/arther/assistant/MainActivity.java
          test -s android-native/app/src/main/java/com/arther/assistant/ArtherWakeService.java
          test -s android-native/app/src/main/java/com/arther/assistant/ArtherAccessibilityService.java
